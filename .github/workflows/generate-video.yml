name: Generate AI Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video prompt'
        required: true
        default: 'A cinematic shot of a man walking through a desert at sunset, warm lighting, slow motion'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run video generator
        run: |
          echo "=== START VIDEO GENERATOR ==="
          npm run run
          echo "=== END VIDEO GENERATOR ==="

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
          if-no-files-found: ignore
